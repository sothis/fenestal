#
# The release tree of every target, on every push to main and every pull
# request, and ruff over tools/. The run's artifacts are the commented
# source zip and an archive of what each target made (.github/stage.sh). A
# build that succeeds has run verifyfont, verifykeymap, the fuzz replay,
# the ABI comparison, the layering, the tables and the API reference's
# caller check, so a green Linux build is those as well. The checker trees
# -- clang, asan, tsan, analyzer, gc -- are left to CONTRIBUTING.md's list.
#
# What it cannot run: a program. There is no display or GPU here, and the
# harness (tools/drive/) drives desktops and machines of its own; a change in
# how a window behaves is still checked by hand.
#
# Linux runs in Ubuntu 26.04, the release the tree is developed on, so gcc's
# warnings are the ones a developer sees. The macOS tree is built on a Mac,
# whose Xcode has Apple's SDK: the SDK is licensed to Apple's machines, so it
# is never copied to Linux here, where a cache or an artifact would hand it
# to anyone. It is still the cross build, clang-21 and ld64.lld, once for
# x86-64 and once for arm64, with what a Linux machine supplies to it -- the
# baked font and the Khronos headers -- handed over from the Linux job.
#
# Actions are pinned by commit, the tag above each.

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    # The cache entry the Linux job hands the macOS job, this run's alone.
    MACOS_INPUTS: macos-inputs-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # One job for the three trees a Linux machine builds: the cross trees
    # borrow the Linux tree's baked font, which build.sh lends only when its
    # files are newer than their sources and its check newer than the bake.
    linux:
        name: linux, win64, linux-arm64
        runs-on: ubuntu-latest
        timeout-minutes: 60
        container:
            image: ubuntu:26.04
        env:
            DEBIAN_FRONTEND: noninteractive
        # The macOS job wants the bake, and not the cross trees' passing.
        outputs:
            bake: ${{ steps.linux.outcome }}
        steps:
            # What every Linux tree needs (README *Building*), the two cross
            # compilers, and git, which mkdist.py reads the file list from:
            # checked out without it, the tree is a tarball, and build.sh
            # skips the pack silently.
            - name: Install packages
              run: |
                  apt-get update -q
                  apt-get install -qy \
                      git ca-certificates cmake make gcc g++ pkgconf \
                      python3 linux-libc-dev libvulkan-dev libegl-dev \
                      libgl-dev libwayland-dev libwayland-bin libxcb1-dev \
                      libfreetype-dev glslang-tools spirv-cross xkb-data \
                      xz-utils zstd \
                      gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 \
                      gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # The checkout is the runner's user's and the container runs as
            # root, so git calls it dubious and answers nothing -- and
            # build.sh, finding no checkout, skips the pack as silently as
            # for a tarball. The checkout action trusts it for its own step
            # alone. The zips are then checked for by name: a pack skipped
            # is otherwise a green build that checked less.
            - name: linux release
              id: linux
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  ./build.sh linux release
                  test -s build/fenestal.zip
                  test -s build/fenestal-commented.zip
                  .github/stage.sh common
                  .github/stage.sh linux
            - name: Keep the linux archive
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.linux.outputs.archive }}
                  archive: false
                  if-no-files-found: error
            - name: The source zip
              id: source
              run: .github/stage.sh source
            - name: Keep the source zip
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.source.outputs.archive }}
                  archive: false
                  if-no-files-found: error
            # The four files a cross tree takes from the bake, and the stamp
            # build.sh reads as verifyfont's pass; the Khronos headers the
            # macOS tree finds in /usr/include on Linux, which a Mac has
            # none of (FNL_HOST_INCLUDE); and what every target's archive
            # holds, whose API reference the Mac does not make.
            - name: Gather the macOS tree's inputs
              run: |
                  g=build/linux/release/generated
                  mkdir -p mac/font mac/include/GL mac/include/KHR
                  cp $g/font_data.h $g/font_metrics.h $g/font_atlas.bin \
                     $g/font_cells.bin $g/font_verified.stamp mac/font/
                  cp -R /usr/include/vulkan /usr/include/vk_video \
                     mac/include/
                  cp /usr/include/GL/glcorearb.h mac/include/GL/
                  cp /usr/include/KHR/khrplatform.h mac/include/KHR/
                  cp -R stage/common mac/common
            # Through the cache and not as an artifact, which would be one
            # more download on the run's page. The key is this run's alone;
            # an entry nothing restores again is evicted after seven days.
            # zstd above is what makes the entry the Mac's to restore: the
            # compression is part of a cache's version, and the Mac's tar
            # has zstd.
            - name: Hand them to the macOS job
              # v6.1.0
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: mac
                  key: ${{ env.MACOS_INPUTS }}
            # Each cross tree after the Linux one, and the second whether or
            # not the first passed: they find different things.
            - name: win64 release
              id: win64
              if: ${{ !cancelled() && steps.linux.outcome == 'success' }}
              run: |
                  ./build.sh win64 release
                  .github/stage.sh win64
            - name: Keep the win64 archive
              if: ${{ !cancelled() && steps.win64.outcome == 'success' }}
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.win64.outputs.archive }}
                  archive: false
                  if-no-files-found: error
            - name: linux-arm64 release
              id: arm64
              if: ${{ !cancelled() && steps.linux.outcome == 'success' }}
              run: |
                  ./build.sh linux-arm64 release
                  .github/stage.sh linux-arm64
            - name: Keep the linux-arm64 archive
              if: ${{ !cancelled() && steps.arm64.outcome == 'success' }}
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.arm64.outputs.archive }}
                  archive: false
                  if-no-files-found: error

    macos:
        name: macos
        needs: linux
        if: ${{ !cancelled() && needs.linux.outputs.bake == 'success' }}
        runs-on: macos-26
        timeout-minutes: 30
        env:
            # The source checks and the zips are the checkout's, and the
            # Linux job has run them.
            FNL_NO_DIST: 1
        steps:
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # clang-21, as on Linux, by FNL_CLANG; LLVM's tools and lld on
            # PATH, where the toolchain file looks for them by name. llvm@21
            # comes in as lld@21's dependency and is not named: named, it is
            # installed on request, and Homebrew then warns that it left it
            # unlinked beside the image's llvm@20 -- a link nothing here
            # uses, since every path is brew --prefix's.
            - name: Install LLVM 21 and the shader tools
              run: |
                  brew install lld@21 glslang spirv-cross
                  echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
                  echo "$(brew --prefix lld@21)/bin" >> "$GITHUB_PATH"
                  echo "FNL_CLANG=$(brew --prefix llvm@21)/bin/clang" \
                      >> "$GITHUB_ENV"
            # The SDK the tree pins (tools/macos_sdk.py), from whichever
            # Xcode has it, linked where macos_sdk.py --path looks; none
            # with that version is a failure that lists what there is.
            - name: Find the pinned macOS SDK
              run: |
                  echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"
                  XDG_STATE_HOME=$RUNNER_TEMP/state python3 - <<'EOF'
                  import glob, os, sys
                  sys.path.insert(0, "tools")
                  import macos_sdk
                  found = {}
                  for sdk in sorted(glob.glob(
                          "/Applications/Xcode*.app/Contents/Developer/"
                          "Platforms/MacOSX.platform/Developer/SDKs/"
                          "MacOSX*.sdk")
                          + glob.glob("/Library/Developer/CommandLineTools/"
                                      "SDKs/MacOSX*.sdk")):
                      found.setdefault(macos_sdk.version(sdk), sdk)
                  if macos_sdk.VERSION not in found:
                      sys.exit("no macOS SDK %s here; there are %s"
                               % (macos_sdk.VERSION,
                                  ", ".join(sorted(map(str, found)))))
                  os.makedirs(macos_sdk.HOME, exist_ok=True)
                  os.symlink(os.path.realpath(found[macos_sdk.VERSION]),
                             macos_sdk.SDK)
                  print("macOS SDK %s: %s" % (macos_sdk.VERSION,
                                              found[macos_sdk.VERSION]))
                  EOF
            - name: Take the Linux job's font, headers and common files
              # v6.1.0
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: mac
                  key: ${{ env.MACOS_INPUTS }}
                  fail-on-cache-miss: true
            # Where build.sh looks for the bake. The files keep the Linux
            # job's times, older than this checkout, and build.sh lends a
            # bake only when it is newer than its sources and verifyfont's
            # stamp newer than it, so the two are dated again in that order;
            # the Linux job's build passed verifyfont, or it would have
            # saved nothing.
            - name: Place the font and the common files
              run: |
                  g=build/linux/release/generated
                  mkdir -p $g
                  cp mac/font/* $g/
                  touch $g/font_atlas.bin
                  sleep 1
                  touch $g/font_verified.stamp
                  mkdir -p stage
                  cp -R mac/common stage/common
            # Both processors' trees, joined into one archive of universal
            # binaries and app bundles (.github/stage.sh).
            - name: macos and macos-arm64 release
              id: macos
              run: |
                  inc="$PWD/mac/include"
                  for t in macos macos-arm64; do
                      echo "::group::$t release"
                      # Homebrew's opt has no version or prefix in its
                      # name, which the toolchain file does not take on its
                      # own.
                      ./build.sh $t release "-DFNL_HOST_INCLUDE=$inc" \
                          "-DFNL_VULKAN_INCLUDE_DIR=$inc" \
                          "-DFNL_LLVM_OPT=$(brew --prefix llvm@21)/bin/opt"
                      echo "::endgroup::"
                  done
                  .github/stage.sh macos
            - name: Keep the macos archive
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.macos.outputs.archive }}
                  archive: false
                  if-no-files-found: error

    ruff:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # The version the tree is held clean against; a newer one's new
            # rules are a change of their own.
            - name: ruff check tools
              run: pipx run --spec ruff==0.17.0 ruff check tools
