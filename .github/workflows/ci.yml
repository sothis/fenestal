# Copyright (c) 2026 Janos Sonntag
#
# The release tree of every target, on every push to main and every pull
# request, and ruff over tools/. A push of a v* tag is a release: the same
# trees, and a job that attaches what they made to a GitHub Release. The
# weekly run, and one asked for by hand, builds the checker trees too --
# clang, asan, tsan, analyzer and gc, on every target that takes them --
# which a push does not; they are compiled there and never run. The run's
# artifacts are the commented source zip and an archive of what each
# target made (.github/stage.sh). A
# build that succeeds has run verifyfont, verifykeymap, the fuzz replay,
# the ABI comparison, the layering, the tables and the API reference's
# caller check, so a green Linux build is those as well.
#
# What it cannot run: a program. There is no display or GPU here, and the
# harness (tools/drive/) drives desktops and machines of its own; a change in
# how a window behaves is still checked by hand.
#
# Linux runs in Ubuntu 26.04, the release the tree is developed on, so gcc's
# warnings are the ones a developer sees. The macOS tree is built on a Mac,
# whose Xcode has Apple's SDK: the SDK is licensed to Apple's machines, so it
# is never copied to Linux here, where a cache or an artifact would hand it
# to anyone. It is still the cross build, clang-21 and ld64.lld, once for
# x86-64 and once for arm64, with what a Linux machine supplies to it -- the
# baked font and the Khronos headers -- handed over from the Linux job.
#
# Actions are pinned by commit, the tag above each.

name: CI

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
    workflow_dispatch:
    # Mondays at 04:00 UTC: the checker trees, which a push skips.
    schedule:
        - cron: '0 4 * * 1'

permissions:
    contents: read

env:
    # The cache entry the Linux job hands the macOS job, this run's alone.
    MACOS_INPUTS: macos-inputs-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # One job for the three trees a Linux machine builds: the cross trees
    # borrow the Linux tree's baked font, which build.sh lends only when its
    # files are newer than their sources and its check newer than the bake.
    linux:
        name: linux, win64, linux-arm64
        runs-on: ubuntu-latest
        timeout-minutes: 60
        container:
            image: ubuntu:26.04
        env:
            DEBIAN_FRONTEND: noninteractive
        # The macOS job wants the bake, and not the cross trees' passing.
        outputs:
            bake: ${{ steps.linux.outcome }}
        steps:
            # What every Linux tree needs (README *Building*), the two cross
            # compilers, and git, which mkdist.py reads the file list from:
            # checked out without it, the tree is a tarball, and build.sh
            # skips the pack silently.
            - name: Install packages
              run: |
                  apt-get update -q
                  apt-get install -qy \
                      git ca-certificates cmake make gcc g++ pkgconf \
                      python3 linux-libc-dev libvulkan-dev libegl-dev \
                      libgl-dev libwayland-dev libwayland-bin libxcb1-dev \
                      libfreetype-dev glslang-tools spirv-cross xkb-data \
                      xz-utils zstd curl binutils-mingw-w64-x86-64 \
                      gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            # mingw-w64's Ubuntu packaging is built for msvcrt, and the tree
            # links the Universal CRT. llvm-mingw's UCRT release is the cross
            # compiler the win64 tree takes; build.sh refuses any other.
            - name: Install llvm-mingw's UCRT toolchain
              run: |
                  url=https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64.tar.xz
                  sha=e7a15a49a2ea95e9f3d8a9d0cfabe5052a4b10fb4777cc54de5a8c27b64bb701
                  curl -fsSL "$url" -o /tmp/llvm-mingw.tar.xz
                  echo "$sha  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
                  mkdir -p /opt/llvm-mingw
                  tar -xJf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw \
                      --strip-components=1
                  echo "FNL_MINGW_PREFIX=/opt/llvm-mingw/bin/x86_64-w64-mingw32-" >> "$GITHUB_ENV"
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # The checkout is the runner's user's and the container runs as
            # root, so git calls it dubious and answers nothing -- and
            # build.sh, finding no checkout, skips the pack as silently as
            # for a tarball. The checkout action trusts it for its own step
            # alone. The zips are then checked for by name: a pack skipped
            # is otherwise a green build that checked less.
            - name: linux release
              id: linux
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  ./build.sh linux release
                  test -s build/fenestal.zip
                  test -s build/fenestal-commented.zip
                  .github/stage.sh common
                  .github/stage.sh linux
            - name: Keep the linux archive
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.linux.outputs.archive }}
                  archive: false
                  if-no-files-found: error
            - name: The source zip
              id: source
              run: .github/stage.sh source
            - name: Keep the source zip
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.source.outputs.archive }}
                  archive: false
                  if-no-files-found: error
            # The four files a cross tree takes from the bake, and the stamp
            # build.sh reads as verifyfont's pass; the Khronos headers the
            # macOS tree finds in /usr/include on Linux, which a Mac has
            # none of (FNL_HOST_INCLUDE); and what every target's archive
            # holds, whose API reference the Mac does not make.
            - name: Gather the macOS tree's inputs
              run: |
                  g=build/linux/release/generated
                  mkdir -p mac/font mac/include/GL mac/include/KHR
                  cp $g/font_data.h $g/font_metrics.h $g/font_atlas.bin \
                     $g/font_cells.bin $g/font_verified.stamp mac/font/
                  cp -R /usr/include/vulkan /usr/include/vk_video \
                     mac/include/
                  cp /usr/include/GL/glcorearb.h mac/include/GL/
                  cp /usr/include/KHR/khrplatform.h mac/include/KHR/
                  cp -R stage/common mac/common
            # The Mac restores them through the cache: the key is this run's
            # alone, and zstd above is what makes the entry the Mac's to
            # restore, the compression being part of a cache's version and
            # the Mac's tar having zstd.
            - name: Hand them to the macOS job
              # v6.1.0
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: mac
                  key: ${{ env.MACOS_INPUTS }}
            # Each cross tree after the Linux one, and the second whether or
            # not the first passed: they find different things.
            - name: win64 release
              id: win64
              if: ${{ !cancelled() && steps.linux.outcome == 'success' }}
              run: |
                  ./build.sh win64 release
                  .github/stage.sh win64
            - name: Keep the win64 archive
              if: ${{ !cancelled() && steps.win64.outcome == 'success' }}
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.win64.outputs.archive }}
                  archive: false
                  if-no-files-found: error
            - name: linux-arm64 release
              id: arm64
              if: ${{ !cancelled() && steps.linux.outcome == 'success' }}
              run: |
                  ./build.sh linux-arm64 release
                  .github/stage.sh linux-arm64
            - name: Keep the linux-arm64 archive
              if: ${{ !cancelled() && steps.arm64.outcome == 'success' }}
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.arm64.outputs.archive }}
                  archive: false
                  if-no-files-found: error

    # The checker trees, which a push does not build: the weekly run and one
    # asked for by hand do. They have a job and a container of their own:
    # TSan's shadow cannot share the runner's ASLR layout, and it disables
    # ASLR itself with personality(), which the default seccomp profile
    # refuses -- so this job's container is the one unconfined, and no
    # push's. The bake comes from the Linux job's cache, as the Mac's does.
    checkers:
        name: checkers
        needs: linux
        if: >-
            ${{ !cancelled() &&
                (github.event_name == 'schedule' ||
                 github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        container:
            image: ubuntu:26.04
            options: --security-opt seccomp=unconfined
        env:
            DEBIAN_FRONTEND: noninteractive
        steps:
            - name: Install packages
              run: |
                  apt-get update -q
                  apt-get install -qy \
                      git ca-certificates cmake make gcc g++ pkgconf \
                      python3 linux-libc-dev libvulkan-dev libegl-dev \
                      libgl-dev libwayland-dev libwayland-bin libxcb1-dev \
                      libfreetype-dev glslang-tools spirv-cross xkb-data \
                      xz-utils zstd clang-21 curl binutils-mingw-w64-x86-64 \
                      gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            # The win64 checker trees need the same UCRT compiler the Linux
            # job builds the release tree with; see that job's step.
            - name: Install llvm-mingw's UCRT toolchain
              run: |
                  url=https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64.tar.xz
                  sha=e7a15a49a2ea95e9f3d8a9d0cfabe5052a4b10fb4777cc54de5a8c27b64bb701
                  curl -fsSL "$url" -o /tmp/llvm-mingw.tar.xz
                  echo "$sha  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
                  mkdir -p /opt/llvm-mingw
                  tar -xJf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw \
                      --strip-components=1
                  echo "FNL_MINGW_PREFIX=/opt/llvm-mingw/bin/x86_64-w64-mingw32-" >> "$GITHUB_ENV"
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # The font tools run during the build and a cross or checker
            # tree takes the host's bake rather than making one; the Linux
            # job saved it with verifyfont's pass, which a lender needs.
            - name: Take the Linux job's font
              # v6.1.0
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: mac
                  key: ${{ env.MACOS_INPUTS }}
                  fail-on-cache-miss: true
            - name: Place the font
              run: |
                  g=build/linux/release/generated
                  mkdir -p $g
                  cp mac/font/* $g/
                  touch $g/font_atlas.bin
                  sleep 1
                  touch $g/font_verified.stamp
            # Every variant the target takes. Each is a build with its
            # in-build checks, and none is run -- there is no desktop here.
            - name: Checker trees
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  for v in clang asan tsan analyzer gc; do
                      echo "::group::linux $v"
                      ./build.sh linux $v
                      echo "::endgroup::"
                  done
                  for v in asan tsan gc; do
                      echo "::group::linux-arm64 $v"
                      ./build.sh linux-arm64 $v
                      echo "::endgroup::"
                  done
                  for v in analyzer gc; do
                      if [ "$v" = analyzer ] &&
                         "${FNL_MINGW_PREFIX}gcc" --version |
                         grep -qi clang; then
                          echo "::group::win64 analyzer skipped"
                          echo "clang-based UCRT has no -fanalyzer"
                          echo "::endgroup::"
                          continue
                      fi
                      echo "::group::win64 $v"
                      ./build.sh win64 $v
                      echo "::endgroup::"
                  done

    macos:
        name: macos
        needs: linux
        if: ${{ !cancelled() && needs.linux.outputs.bake == 'success' }}
        runs-on: macos-26
        timeout-minutes: 45
        env:
            # The source checks and the zips are the checkout's, and the
            # Linux job has run them.
            FNL_NO_DIST: 1
        steps:
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # clang-21, as on Linux, by FNL_CLANG; LLVM's tools and lld on
            # PATH, where the toolchain file looks for them by name. llvm@21
            # comes in as lld@21's dependency and is not named: named, it is
            # installed on request, and Homebrew then warns that it left it
            # unlinked beside the image's llvm@20 -- a link nothing here
            # uses, since every path is brew --prefix's.
            - name: Install LLVM 21 and the shader tools
              run: |
                  brew install lld@21 glslang spirv-cross
                  echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
                  echo "$(brew --prefix lld@21)/bin" >> "$GITHUB_PATH"
                  echo "FNL_CLANG=$(brew --prefix llvm@21)/bin/clang" \
                      >> "$GITHUB_ENV"
            # The SDK the tree pins (tools/macos_sdk.py), from whichever
            # Xcode has it, linked where macos_sdk.py --path looks; none
            # with that version is a failure that lists what there is.
            - name: Find the pinned macOS SDK
              run: |
                  echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"
                  XDG_STATE_HOME=$RUNNER_TEMP/state python3 - <<'EOF'
                  import glob, os, sys
                  sys.path.insert(0, "tools")
                  import macos_sdk
                  found = {}
                  for sdk in sorted(glob.glob(
                          "/Applications/Xcode*.app/Contents/Developer/"
                          "Platforms/MacOSX.platform/Developer/SDKs/"
                          "MacOSX*.sdk")
                          + glob.glob("/Library/Developer/CommandLineTools/"
                                      "SDKs/MacOSX*.sdk")):
                      found.setdefault(macos_sdk.version(sdk), sdk)
                  if macos_sdk.VERSION not in found:
                      sys.exit("no macOS SDK %s here; there are %s"
                               % (macos_sdk.VERSION,
                                  ", ".join(sorted(map(str, found)))))
                  os.makedirs(macos_sdk.HOME, exist_ok=True)
                  os.symlink(os.path.realpath(found[macos_sdk.VERSION]),
                             macos_sdk.SDK)
                  print("macOS SDK %s: %s" % (macos_sdk.VERSION,
                                              found[macos_sdk.VERSION]))
                  EOF
            - name: Take the Linux job's font, headers and common files
              # v6.1.0
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: mac
                  key: ${{ env.MACOS_INPUTS }}
                  fail-on-cache-miss: true
            # Where build.sh looks for the bake. The files keep the Linux
            # job's times, older than this checkout, and build.sh lends a
            # bake only when it is newer than its sources and verifyfont's
            # stamp newer than it, so the two are dated again in that order;
            # the Linux job's build passed verifyfont, or it would have
            # saved nothing.
            - name: Place the font and the common files
              run: |
                  g=build/linux/release/generated
                  mkdir -p $g
                  cp mac/font/* $g/
                  touch $g/font_atlas.bin
                  sleep 1
                  touch $g/font_verified.stamp
                  mkdir -p stage
                  cp -R mac/common stage/common
            # Both processors' trees, joined into one archive of universal
            # binaries and app bundles (.github/stage.sh).
            - name: macos and macos-arm64 release
              id: macos
              run: |
                  inc="$PWD/mac/include"
                  for t in macos macos-arm64; do
                      echo "::group::$t release"
                      # Homebrew's opt has no version or prefix in its
                      # name, which the toolchain file does not take on its
                      # own.
                      ./build.sh $t release "-DFNL_HOST_INCLUDE=$inc" \
                          "-DFNL_VULKAN_INCLUDE_DIR=$inc" \
                          "-DFNL_LLVM_OPT=$(brew --prefix llvm@21)/bin/opt"
                      echo "::endgroup::"
                  done
                  echo "::group::macos-universal release"
                  ./build.sh macos-universal release \
                      "-DFNL_HOST_INCLUDE=$inc" \
                      "-DFNL_VULKAN_INCLUDE_DIR=$inc" \
                      "-DFNL_LLVM_OPT=$(brew --prefix llvm@21)/bin/opt"
                  echo "::endgroup::"
                  .github/stage.sh macos
            - name: Keep the macos archive
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.macos.outputs.archive }}
                  archive: false
                  if-no-files-found: error
            # The Mac's checker trees, as the Linux job's: gc on both
            # processors, with the same inputs as the release trees.
            - name: macos and macos-arm64 gc
              if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
              run: |
                  inc="$PWD/mac/include"
                  for t in macos macos-arm64; do
                      echo "::group::$t gc"
                      ./build.sh $t gc "-DFNL_HOST_INCLUDE=$inc" \
                          "-DFNL_VULKAN_INCLUDE_DIR=$inc" \
                          "-DFNL_LLVM_OPT=$(brew --prefix llvm@21)/bin/opt"
                      echo "::endgroup::"
                  done
                  echo "::group::macos-universal gc"
                  ./build.sh macos-universal gc \
                      "-DFNL_HOST_INCLUDE=$inc" \
                      "-DFNL_VULKAN_INCLUDE_DIR=$inc" \
                      "-DFNL_LLVM_OPT=$(brew --prefix llvm@21)/bin/opt"
                  echo "::endgroup::"

    # Native Windows with cl.exe: no mingw, no cross sysroot. FreeType comes
    # from vcpkg, so mkfont and verifyfont are built by MSVC and the tree
    # bakes its own font -- the native bake path, not a borrowed one. The
    # shader tools and Vulkan headers are MSYS2's UCRT64 packages, and dxc
    # is Microsoft's Windows release through tools/dxc.py. The library opens
    # the Vulkan loader at run time and links none, so headers without a
    # .lib are enough.
    windows:
        name: win64-msvc
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Install FreeType with vcpkg
              run: vcpkg install freetype:x64-windows
            # UCRT64's glslang, spirv-cross and Vulkan headers, and the
            # shell, CMake, Ninja and Python the build runs under. Python is
            # the UCRT64 build: os.name is "nt", which is how tools/dxc.py
            # chooses the Windows release.
            - name: Install MSYS2's tools
              # v2.34.0
              uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
              with:
                  msystem: UCRT64
                  update: false
                  # The MSVC environment above is a PATH the step sets, and
                  # the default path type drops it; cl is found through it.
                  path-type: inherit
                  install: >-
                      git
                      mingw-w64-ucrt-x86_64-cmake
                      mingw-w64-ucrt-x86_64-ninja
                      mingw-w64-ucrt-x86_64-python
                      mingw-w64-ucrt-x86_64-glslang
                      mingw-w64-ucrt-x86_64-spirv-cross
                      mingw-w64-ucrt-x86_64-vulkan-headers
            # cl, link, lib and the Windows SDK on PATH for the step below.
            - name: Enter the MSVC environment
              # v1.13.0
              uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
              with:
                  arch: x64
            - name: win64-msvc release
              id: msvc
              shell: msys2 {0}
              run: |
                  export FNL_DXC="$(python3 tools/dxc.py --path)"
                  export GITHUB_OUTPUT="$(cygpath -u "$GITHUB_OUTPUT")"
                  ./build.sh win64-msvc release \
                      "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                      "-DVCPKG_TARGET_TRIPLET=x64-windows" \
                      "-DVulkan_INCLUDE_DIR=$(cygpath -w /ucrt64/include)"
                  .github/stage.sh common
                  .github/stage.sh win64-msvc
            - name: Keep the win64-msvc archive
              if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: ${{ steps.msvc.outputs.archive }}
                  archive: false
                  if-no-files-found: error

    # FreeBSD, in a VM: the native build and the checks it runs. No hosted
    # FreeBSD runner exists, and this builds, never drives, the programs.
    freebsd:
        name: freebsd
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Build and pack on FreeBSD
              # v1.6.0
              uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
              with:
                  usesh: true
                  prepare: |
                      pkg install -y cmake pkgconf python3 git \
                          wayland libxcb libdrm mesa-libs libglvnd \
                          vulkan-headers glslang spirv-cross freetype2 \
                          xkeyboard-config llvm
                  run: |
                      ./build.sh freebsd release
                      .github/stage.sh common
                      GITHUB_OUTPUT= .github/stage.sh freebsd
            - name: Keep the freebsd archive
              # v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  path: stage/fenestal-freebsd-*.tar.xz
                  archive: false
                  if-no-files-found: error

    ruff:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # The version the tree is held clean against; a newer one's new
            # rules are a change of their own.
            - name: ruff check tools
              run: pipx run --spec ruff==0.17.0 ruff check tools

    # A tag is a release. The jobs above build the tagged commit as they
    # build a branch's; this one attaches what they made to a GitHub
    # Release, which a reader downloads without signing in and which does
    # not expire as a run's artifacts do. The assets are named for the tag,
    # not the commit, and the notes are CHANGELOG.md's section for it. A
    # tag with no section falls back to GitHub's generated notes.
    release:
        name: publish
        needs: [linux, macos, windows, freebsd]
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # The workflow's read is for building; this job writes the release.
        permissions:
            contents: write
        steps:
            # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # Every target's archive, an artifact of its own and merged into
            # one directory here. The run is this job's own. The archives
            # are already packed, and three of them are themselves zips, so
            # they are saved as they were uploaded -- extracted, a zip
            # artifact would come apart into the program tree or the source.
            - name: Take the run's artifacts
              # v8.0.2
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  path: dist
                  merge-multiple: true
                  skip-decompress: true
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version=${GITHUB_REF_NAME#v}
                  for f in dist/*; do
                      n=$(printf '%s' "$f" |
                          sed -E "s/-[0-9a-f]{12}\./-$GITHUB_REF_NAME./")
                      if [ "$n" != "$f" ]; then mv "$f" "$n"; fi
                  done
                  awk -v want="## $version" '
                      /^## / {
                          if (shown) exit
                          if ($0 == want) { shown = 1; next }
                      }
                      shown
                  ' CHANGELOG.md > notes.md
                  # A re-run finds the release this job made and puts the
                  # archives in place of its own; a first run makes it.
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      gh release upload "$GITHUB_REF_NAME" dist/* --clobber
                      if [ -s notes.md ]; then
                          gh release edit "$GITHUB_REF_NAME" \
                              --title "Fenestal $version" --notes-file notes.md
                      else
                          gh release edit "$GITHUB_REF_NAME" \
                              --title "Fenestal $version"
                      fi
                  elif [ -s notes.md ]; then
                      gh release create "$GITHUB_REF_NAME" dist/* \
                          --title "Fenestal $version" --notes-file notes.md
                  else
                      gh release create "$GITHUB_REF_NAME" dist/* \
                          --title "Fenestal $version" --generate-notes
                  fi

    # ── Runner-shortage retry ──────────────────────────────────────────────
    shortage_retry:
        name: shortage retry
        # A job GitHub never starts ("The job was not acquired by Runner of
        # type hosted even after multiple attempts", as when macOS runners run
        # short) ends cancelled, and every job that needs it is skipped: the
        # run fails with no real failure behind it. This job hands the run to
        # .github/workflows/runner-shortage.yml, which checks that a missing
        # runner is the only reason and re-runs the failed jobs.
        #
        # It depends on every other job on purpose: a shortage can cancel any
        # of them, and a job left out of `needs` is invisible to `failure()`
        # and `needs.*.result`. A job added above has to be added here too.
        #
        # This dispatches instead of the retry workflow listening on
        # `workflow_run` because that trigger fires for every completed run,
        # and when the retry job's `if` then skips it GitHub still creates the
        # run and lists it as skipped.
        needs: [linux, checkers, macos, windows, freebsd, ruff, release]
        # A real failure is handed over too; the retry workflow tells it apart
        # and leaves the run alone. A cancelled job is the shortage's own
        # signature; `!cancelled()` keeps out a run superseded by a newer
        # push. A re-run brings this job back too -- it depends on the failed
        # job -- so every attempt asks for its own judgement.
        #
        # GitHub re-runs a run at most 50 times; the chain stops after attempt
        # 50, one short of that, leaving a person a re-run when the automation
        # gives up.
        if: >-
            ${{ always() &&
                !cancelled() &&
                github.event_name == 'push' &&
                github.run_attempt < 50 &&
                (failure() || contains(needs.*.result, 'cancelled')) }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: write   # dispatch the retry workflow
        steps:
            - name: Ask for a runner-shortage retry
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  # The dispatch is an API call; a transient error here would
                  # leave the shortage unretried. Ask up to three times.
                  for i in 1 2 3; do
                      if gh workflow run runner-shortage.yml \
                          -R "$GITHUB_REPOSITORY" \
                          -f run_id="$GITHUB_RUN_ID" \
                          -f attempt="$GITHUB_RUN_ATTEMPT"; then
                          exit 0
                      fi
                      if [ "$i" -lt 3 ]; then sleep 10; fi
                  done
                  exit 1
